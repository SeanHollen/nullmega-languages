<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Faint multi-script glyphs in the corners so the card reads as "languages" even at thumbnail size -->
  <g opacity="0.13" fill="white" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="700">
    <text x="80"   y="170" font-size="130">A</text>
    <text x="1010" y="180" font-size="130">字</text>
    <text x="60"   y="555" font-size="130">ع</text>
    <text x="990"  y="555" font-size="130">ñ</text>
    <text x="540"  y="100" font-size="90">あ</text>
    <text x="560"  y="600" font-size="90">한</text>
  </g>

  <!-- Title — sized so 'Nullmega Languages' fills the centre but leaves clear margin -->
  <text x="600" y="340"
        text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="110" font-weight="800" fill="white"
        letter-spacing="-2">
    Nullmega Languages
  </text>

  <!-- Subtitle -->
  <text x="600" y="420"
        text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="46" font-weight="500" fill="#dcfce7"
        letter-spacing="1">
    Any language, any level
  </text>
</svg>
